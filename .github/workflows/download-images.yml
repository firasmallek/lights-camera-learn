name: Download All Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/download-images.yml'

permissions:
  contents: write

jobs:
  download-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run image download script
        run: python3 download_images.py

      - name: Commit and push real images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/assets
          if git diff --staged --quiet; then
            echo "No image changes to commit"
          else
            git commit -m "Auto-download all real photo assets from Squarespace CDN"
            git push origin main
          fi
